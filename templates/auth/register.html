<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Create an Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .page-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      width: 100%;
      max-width: 900px;
    }

    /* Left illustration */
    .illustration {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .illustration svg {
      width: 180px;
      height: 180px;
    }

    /* Card */
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      /* max-width: 420px; */
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .card h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .card p.subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }

    .form-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .form-group label {
      font-size: 12px;
      color: #555;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input {
      border: 1.5px solid #dde3dd;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    .form-group input:focus {
      border-color: #2e8b4a;
    }

    .btn-register {
      width: 100%;
      padding: 12px;
      background: #2e8b4a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-register:hover {
      background: #236e3b;
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #666;
    }

    .login-link a {
      color: #2e8b4a;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

  .error-message{
      background:#fee2e2;
      color:#dc2626;
      padding:12px;
      border-radius:8px;
      margin-bottom:16px;
      font-size:14px;
      font-weight:500;
  }



    /* Responsive */
    @media (max-width: 700px) {
      .illustration { display: none; }
      .card { padding: 30px 20px; }
      .form-row { flex-direction: column; gap: 0; }
    }

    @media (max-width: 400px) {
      .card h1 { font-size: 19px; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">

  <!-- Left Illustration -->
  <div class="illustration">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Clipboard body -->
      <rect x="40" y="40" width="110" height="140" rx="10" fill="#1a2e4a"/>
      <!-- Clipboard top clip -->
      <rect x="75" y="30" width="40" height="22" rx="8" fill="#1a2e4a"/>
      <rect x="80" y="34" width="30" height="14" rx="5" fill="#e8f0e8"/>
      <!-- Lines on clipboard -->
      <rect x="60" y="80" width="70" height="8" rx="3" fill="#2e5f7a" opacity="0.5"/>
      <rect x="60" y="98" width="55" height="8" rx="3" fill="#2e5f7a" opacity="0.4"/>
      <rect x="60" y="116" width="65" height="8" rx="3" fill="#2e5f7a" opacity="0.3"/>
      <!-- Green shield -->
      <path d="M90 130 Q90 165 120 155 Q150 165 150 130 L120 118 Z" fill="#2e8b4a"/>
      <!-- Checkmark -->
      <polyline points="108,143 117,153 134,135" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Register Card -->

  
  <div class="card">
    <h1>Create an Account</h1>
    <p class="subtitle">Join us to report and solve issues</p>
    {% if error %}

    <script> alert("{{ error }}"); </script>

    {% endif %}

    <form method="POST">
       {% csrf_token %} 
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text"  name="first_name" placeholder="Enter First Name" minlength="2" maxlength="30" pattern="[A-Za-z]+" title="Only letters allowed" required/>

        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text"  name="last_name" placeholder="Enter Last Name" minlength="2" maxlength="30" pattern="[A-Za-z]+" title="Only letters allowed" required />
        </div>
        
        <div class="form-group">
          <label>Username</label>
          <input type="text" name = "username" placeholder="Username" minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+" title="Only letters, numbers and underscore allowed" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email"  name = "email" placeholder="Email-Id" required/>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" name = "mobile_number" pattern="[0-9]{10}" maxlength="10" title="Enter valid 10 digit mobile number" placeholder="Mobile Number" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name = "password" minlength="6" placeholder="Password" required/>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password"  name="confirm_password" minlength="6" placeholder="Confirm Password" required/>
        </div>
      </div>

      <button type="submit" class="btn-register">Register</button>

      <p class="login-link">
        Already have an account? <a href="{% url 'login' %}">Login</a>
      </p>
    </form>
  </div>

</div>

</body>
</html>
