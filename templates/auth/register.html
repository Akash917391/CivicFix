{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Create an Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/register.css' %}">

</head>
<body>

<div class="page-wrapper">

  <!-- Left Illustration -->
  <div class="illustration">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Clipboard body -->
      <rect x="40" y="40" width="110" height="140" rx="10" fill="#1a2e4a"/>
      <!-- Clipboard top clip -->
      <rect x="75" y="30" width="40" height="22" rx="8" fill="#1a2e4a"/>
      <rect x="80" y="34" width="30" height="14" rx="5" fill="#e8f0e8"/>
      <!-- Lines on clipboard -->
      <rect x="60" y="80" width="70" height="8" rx="3" fill="#2e5f7a" opacity="0.5"/>
      <rect x="60" y="98" width="55" height="8" rx="3" fill="#2e5f7a" opacity="0.4"/>
      <rect x="60" y="116" width="65" height="8" rx="3" fill="#2e5f7a" opacity="0.3"/>
      <!-- Green shield -->
      <path d="M90 130 Q90 165 120 155 Q150 165 150 130 L120 118 Z" fill="#2e8b4a"/>
      <!-- Checkmark -->
      <polyline points="108,143 117,153 134,135" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Register Card -->

  
  <div class="card">
    <h1>Create an Account</h1>
    <p class="subtitle">Join us to report and solve issues</p>
    {% if error %}

    <script> alert("{{ error }}"); </script>

    {% endif %}

    <form method="POST">
       {% csrf_token %} 
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text"  name="first_name" placeholder="Enter First Name" minlength="2" maxlength="30" pattern="[A-Za-z]+" title="Only letters allowed" required/>

        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text"  name="last_name" placeholder="Enter Last Name" minlength="2" maxlength="30" pattern="[A-Za-z]+" title="Only letters allowed" required />
        </div>
        
        <div class="form-group">
          <label>Username</label>
          <input type="text" name = "username" placeholder="Username" minlength="4" maxlength="20" pattern="[A-Za-z0-9_]+" title="Only letters, numbers and underscore allowed" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email"  name = "email" placeholder="Email-Id" required/>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" name = "mobile_number" pattern="[0-9]{10}" maxlength="10" title="Enter valid 10 digit mobile number" placeholder="Mobile Number" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name = "password" minlength="6" placeholder="Password" required/>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password"  name="confirm_password" minlength="6" placeholder="Confirm Password" required/>
        </div>
      </div>

      <button type="submit" class="btn-register">Register</button>

      <p class="login-link">
        Already have an account? <a href="{% url 'login' %}">Login</a>
      </p>
    </form>
  </div>

</div>

</body>
</html>
